  - { ref: "ghcr.io/getbrik/brik-runner-node",     tag: "24",   digest: "sha256:209f0b9bcedffbfd5a258282b8616ff3dee18804168a93c667bb06e7fc9eecac" }
  - { ref: "ghcr.io/getbrik/brik-runner-python",   tag: "3.13", digest: "sha256:3ca1814879c9d01297324104b3ddd4ea017af54a8e549eba5e673d7384528093" }
